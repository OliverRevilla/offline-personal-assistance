services:
  ollama:
    image: ollama/ollama:latest
    container_name: opa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: opa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  orchestrator:
    build:
      context: ../apps/orchestrator
    container_name: opa-orchestrator
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  ollama_models:
  qdrant_storage:
