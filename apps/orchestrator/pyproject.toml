[project]
name = "orchestrator"
version = "0.1.0"
description = "Orchestrator FastAPI: WS gateway, streaming LLM (Ollama), STT/TTS, tool calling."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.9",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "webrtcvad>=2.0.10",
    # faster-whisper/ctranslate2 hacen `import pkg_resources` en tiempo de ejecución.
    # `[build-system] requires` no alcanza para esto: ese setuptools solo vive en el
    # entorno de build efímero de pip, no en el venv real donde corre la app.
    "setuptools>=68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "websockets>=12.0",
    "sounddevice>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
