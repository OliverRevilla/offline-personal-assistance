[package]
name = "offline-personal-assistant"
version = "0.1.0"
description = "Frontend de escritorio del asistente de voz offline"
edition = "2021"

[lib]
name = "offline_personal_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
